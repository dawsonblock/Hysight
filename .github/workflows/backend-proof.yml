name: backend-proof

on:
    push:
        paths:
            - ".github/workflows/backend-proof.yml"
            - "backend/**"
            - "contract/**"
            - "hca/**"
            - "memvid/**"
            - "memvid_service/**"
            - "memory_service/**"
            - "pyproject.toml"
            - "README.md"
            - "tests/**"
    pull_request:
        paths:
            - ".github/workflows/backend-proof.yml"
            - "backend/**"
            - "contract/**"
            - "hca/**"
            - "memvid/**"
            - "memvid_service/**"
            - "memory_service/**"
            - "pyproject.toml"
            - "README.md"
            - "tests/**"
    workflow_dispatch:
        inputs:
            run_live_sidecar:
                description: "Run the live Rust memvid sidecar proof"
                required: false
                default: false
                type: boolean

jobs:
    hca-smoke:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: "pip"
                  cache-dependency-path: |
                      backend/requirements.txt
                      backend/requirements-test.txt
                      hca/pyproject.toml
            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e ./hca
                  python -m pip install -r backend/requirements-test.txt
            - name: Run HCA smoke proof
              run: python -m pytest tests/test_hca_pipeline.py -q

    contract-conformance:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: "pip"
                  cache-dependency-path: |
                      backend/requirements.txt
                      backend/requirements-test.txt
                      hca/pyproject.toml
            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e ./hca
                  python -m pip install -r backend/requirements-test.txt
            - name: Run contract conformance proof
              run: python -m pytest backend/tests/test_contract_conformance.py -q

    backend-local:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: "pip"
                  cache-dependency-path: |
                      backend/requirements.txt
                      backend/requirements-test.txt
                      hca/pyproject.toml
            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e ./hca
                  python -m pip install -r backend/requirements-test.txt
            - name: Run backend local proof
              run: >-
                  python -m pytest
                  backend/tests/test_hca.py
                  backend/tests/test_memory.py
                  backend/tests/test_server_bootstrap.py
                  -q

    backend-full:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: "pip"
                  cache-dependency-path: |
                      backend/requirements.txt
                      backend/requirements-test.txt
                      hca/pyproject.toml
            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e ./hca
                  python -m pip install -r backend/requirements-test.txt
            - name: Run full backend suite
              run: python -m pytest backend/tests -q

    backend-live-sidecar:
        if: >-
            ${{
                github.event_name != 'workflow_dispatch' ||
                inputs.run_live_sidecar
            }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: "pip"
                  cache-dependency-path: |
                      backend/requirements.txt
                      backend/requirements-test.txt
                      hca/pyproject.toml
            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e ./hca
                  python -m pip install -r backend/requirements-test.txt
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Start memvid sidecar
              run: |
                  cargo run --manifest-path memvid_service/Cargo.toml --release > /tmp/memvid-sidecar.log 2>&1 &
                  echo $! > /tmp/memvid-sidecar.pid
                  for _ in $(seq 1 30); do
                    if curl --fail --silent http://localhost:3031/health >/dev/null; then
                      exit 0
                    fi
                    sleep 1
                  done
                  cat /tmp/memvid-sidecar.log
                  exit 1
            - name: Run live sidecar proof
              env:
                  RUN_MEMVID_TESTS: "1"
                  MEMORY_BACKEND: rust
                  MEMORY_SERVICE_URL: http://localhost:3031
              run: python -m pytest backend/tests/test_memvid_sidecar.py -q
            - name: Stop memvid sidecar
              if: always()
              run: |
                  if [ -f /tmp/memvid-sidecar.pid ]; then
                    kill "$(cat /tmp/memvid-sidecar.pid)" || true
                  fi
